name: showcase-weekly-report
on:
  push:
    paths: ["showcase/weekly-report/**", ".github/workflows/showcase-weekly-report.yml"]
  pull_request:
    paths: ["showcase/weekly-report/**", ".github/workflows/showcase-weekly-report.yml"]
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: showcase/weekly-report
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: showcase/weekly-report/requirements.txt
      - run: pip install -r requirements.txt
      - run: make test
      - run: make demo
      - run: docker build -t weekly-report .
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: showcase/weekly-report/output/
