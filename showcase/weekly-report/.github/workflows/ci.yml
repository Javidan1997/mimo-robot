# Used after this folder is extracted into its own repo (see README).
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: make test
      - run: make demo
      - run: docker build -t weekly-report .
      - uses: actions/upload-artifact@v4
        with:
          name: weekly-report
          path: output/
